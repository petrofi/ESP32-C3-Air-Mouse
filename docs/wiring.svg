<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="1200" height="760" fill="#f7f7f7"/>
  <text x="600" y="58" text-anchor="middle" font-family="Arial" font-size="38" font-weight="700" fill="#111">ESP32-C3 Air Mouse — Bağlantı Şeması</text>
  <text x="600" y="96" text-anchor="middle" font-family="Arial" font-size="20" fill="#555">MPU6050 + 2 buton</text>

  <rect x="90" y="150" rx="22" ry="22" width="390" height="500" fill="#171717"/>
  <text x="285" y="205" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="white">ESP32-C3 Super Mini</text>
  <text x="285" y="240" text-anchor="middle" font-family="Arial" font-size="18" fill="#bbb">USB-C yukarı bakarken</text>

  <g font-family="Arial" font-size="24" font-weight="700">
    <circle cx="445" cy="300" r="9" fill="#e53935"/><text x="355" y="308" fill="white">3.3V</text>
    <circle cx="445" cy="365" r="9" fill="#111" stroke="#fff" stroke-width="2"/><text x="360" y="373" fill="white">GND</text>
    <circle cx="445" cy="430" r="9" fill="#21a449"/><text x="335" y="438" fill="white">GPIO4</text>
    <circle cx="125" cy="300" r="9" fill="#f2c500"/><text x="145" y="308" fill="white">GPIO5</text>
    <circle cx="445" cy="495" r="9" fill="#7e57c2"/><text x="335" y="503" fill="white">GPIO3</text>
    <circle cx="445" cy="560" r="9" fill="#1e88e5"/><text x="335" y="568" fill="white">GPIO2</text>
  </g>

  <rect x="720" y="165" rx="20" ry="20" width="360" height="300" fill="#1976d2"/>
  <text x="900" y="215" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="white">MPU6050 / GY-521</text>
  <g font-family="Arial" font-size="24" font-weight="700" fill="white">
    <text x="770" y="285">VCC</text><circle cx="735" cy="278" r="9" fill="#e53935"/>
    <text x="770" y="345">GND</text><circle cx="735" cy="338" r="9" fill="#111" stroke="#fff" stroke-width="2"/>
    <text x="770" y="405">SCL</text><circle cx="735" cy="398" r="9" fill="#21a449"/>
    <text x="950" y="405">SDA</text><circle cx="1045" cy="398" r="9" fill="#f2c500"/>
  </g>

  <line x1="445" y1="300" x2="735" y2="278" stroke="#e53935" stroke-width="8"/>
  <line x1="445" y1="365" x2="735" y2="338" stroke="#111" stroke-width="8"/>
  <line x1="445" y1="430" x2="735" y2="398" stroke="#21a449" stroke-width="8"/>
  <path d="M125 300 C500 120, 860 120, 1045 398" fill="none" stroke="#f2c500" stroke-width="8"/>

  <rect x="700" y="525" rx="18" ry="18" width="180" height="110" fill="#fff" stroke="#7e57c2" stroke-width="5"/>
  <text x="790" y="570" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700">SOL TIK</text>
  <text x="790" y="605" text-anchor="middle" font-family="Arial" font-size="20">GPIO3 + GND</text>
  <line x1="445" y1="495" x2="700" y2="560" stroke="#7e57c2" stroke-width="8"/>

  <rect x="930" y="525" rx="18" ry="18" width="180" height="110" fill="#fff" stroke="#1e88e5" stroke-width="5"/>
  <text x="1020" y="570" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700">SAĞ TIK</text>
  <text x="1020" y="605" text-anchor="middle" font-family="Arial" font-size="20">GPIO2 + GND</text>
  <line x1="445" y1="560" x2="930" y2="575" stroke="#1e88e5" stroke-width="8"/>

  <text x="600" y="710" text-anchor="middle" font-family="Arial" font-size="20" fill="#444">Sensör: VCC→3.3V • GND→GND • SCL→GPIO4 • SDA→GPIO5</text>
</svg>
